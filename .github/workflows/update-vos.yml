name: 自动更新VOS卖家热议

on:
  schedule:
    - cron: '0 17 * * *'  # 北京时间凌晨1点（UTC 17:00）
  workflow_dispatch:
  repository_dispatch:
    types: [run-now]  # 允许用只有 contents:write 的 PAT 手动触发

permissions:
  contents: write

jobs:
  update-vos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run VOS AI Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python vos-pipeline/fetch_vos.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vos-data.json
          if git diff --staged --quiet; then
            echo "::warning::vos-data.json 无变化，本次没有产出新话题"
          else
            git commit -m "auto: 更新VOS卖家热议 $(date +%Y-%m-%d)"
            git push
          fi

      # 单次无变化是正常的，连续多天无变化才是故障。这里用「最新话题有多旧」来判断，
      # 2026-10 那次欠费就是卡在这个盲区：天天 success，数据冻结 12 天。
      - name: 检查数据新鲜度
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date
          data = json.load(open('vos-data.json', encoding='utf-8-sig'))
          dates = sorted(t.get("effectDate", "") for t in data if t.get("effectDate"))
          if not dates:
              print("::error::vos-data.json 里没有任何 effectDate")
              sys.exit(1)
          newest = date.fromisoformat(dates[-1])
          lag = (date.today() - newest).days
          print(f"共 {len(data)} 条话题，最新 {newest}，滞后 {lag} 天")
          LIMIT = 3
          if lag > LIMIT:
              print(f"::error::VOS 数据已滞后 {lag} 天（阈值 {LIMIT}），"
                    f"请检查 DeepSeek 余额与上一步日志")
              sys.exit(1)
          PY
